<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Taxpayer Watch — UK government spending, ranked by absurdity</title>
<meta name="description" content="UK government and council spending, ranked by how little sense it makes — then by size of the bill. Every figure sourced, with real-world comparisons.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;0,6..72,600;0,6..72,700;1,6..72,400;1,6..72,500&family=IBM+Plex+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --ink: #161a23;
    --ink-soft: #52586a;
    --ink-faint: #868c9c;
    --paper: #e9e6db;
    --paper-raised: #f5f3ea;
    --paper-deep: #ddd9ca;
    --panel-bg: #e3dfd0;
    --rule: #c7c2ae;
    --rule-strong: #a9a28a;
    --alarm: #a8341c;
    --alarm-soft: #c45a3f;
    --amber: #b9792a;
    --moss: #4c6450;
    --white: #fffdf7;
  }

  * { box-sizing: border-box; }

  html { background: var(--paper); }

  body {
    margin: 0;
    padding: 0;
    background:
      radial-gradient(ellipse 1200px 500px at 15% -5%, rgba(168,52,28,0.05), transparent 60%),
      radial-gradient(ellipse 900px 500px at 100% 0%, rgba(22,26,35,0.04), transparent 55%),
      var(--paper);
    color: var(--ink);
    font-family: 'Newsreader', Georgia, serif;
    -webkit-font-smoothing: antialiased;
  }

  .wrap {
    max-width: 920px;
    margin: 0 auto;
    padding: 0 22px 90px;
  }

  /* ---------- Hero ---------- */

  header.masthead {
    padding: 52px 0 36px;
    position: relative;
    max-width: 780px;
  }

  .stamp {
    position: absolute;
    top: 46px;
    right: 0;
    transform: rotate(-4deg);
    border: 1.5px solid var(--alarm);
    color: var(--alarm);
    padding: 5px 11px;
    font-size: 0.68rem;
    font-weight: 600;
    letter-spacing: 0.06em;
    border-radius: 3px;
    opacity: 0.78;
    font-family: 'Newsreader', serif;
    font-variant: small-caps;
  }

  h1.sitename {
    margin: 0;
    font-size: 2.6rem;
    font-weight: 600;
    letter-spacing: -0.015em;
    line-height: 1.05;
    max-width: 10ch;
  }

  .sitename .accent {
    color: var(--alarm);
    font-style: italic;
    font-weight: 500;
  }

  .strapline {
    margin: 14px 0 0;
    font-size: 1.1rem;
    color: var(--ink-soft);
    max-width: 48ch;
    line-height: 1.5;
  }

  .stat-strip {
    margin-top: 32px;
    padding: 20px 0;
    border-top: 1px solid var(--rule-strong);
    border-bottom: 1px solid var(--rule-strong);
    display: flex;
    gap: 40px;
    flex-wrap: wrap;
  }

  .stat { display: flex; flex-direction: column; gap: 2px; }

  .stat .figure {
    font-family: 'IBM Plex Mono', monospace;
    font-weight: 700;
    font-size: 1.9rem;
    color: var(--ink);
    line-height: 1;
  }

  .stat .label { font-size: 0.78rem; color: var(--ink-soft); margin-top: 4px; }

  /* ---------- Controls ---------- */

  .controls {
    margin-top: 26px;
    display: flex;
    gap: 14px;
    align-items: center;
    flex-wrap: wrap;
  }

  .controls label { font-size: 0.92rem; color: var(--ink-soft); }

  select#levelFilter {
    font-family: 'Newsreader', Georgia, serif;
    font-size: 0.98rem;
    font-weight: 500;
    padding: 8px 14px;
    background: var(--paper-raised);
    border: 1px solid var(--rule-strong);
    border-radius: 3px;
    color: var(--ink);
    cursor: pointer;
  }

  .scope-note { font-size: 0.78rem; color: var(--ink-faint); }

  /* ---------- Entries ---------- */

  main { margin-top: 8px; }

  .entry {
    padding: 38px 0;
    border-bottom: 1px solid var(--rule);
    display: grid;
    grid-template-columns: 58px 1fr;
    gap: 22px;
    opacity: 0;
    animation: rise 0.5s ease forwards;
  }

  @keyframes rise {
    from { opacity: 0; transform: translateY(10px); }
    to { opacity: 1; transform: translateY(0); }
  }

  @media (prefers-reduced-motion: reduce) {
    .entry { animation: none; opacity: 1; }
  }

  .entry:last-child { border-bottom: none; }

  .rank-badge {
    width: 50px;
    height: 50px;
    border-radius: 50%;
    border: 2px solid var(--rule-strong);
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: 'Newsreader', serif;
    font-weight: 600;
    font-size: 1.3rem;
    color: var(--ink-soft);
    background: var(--paper-raised);
  }

  .entry-body h2 {
    margin: 0 0 8px;
    font-size: 1.36rem;
    font-weight: 600;
    line-height: 1.32;
    letter-spacing: -0.005em;
  }

  .meta-line {
    display: flex;
    align-items: center;
    gap: 10px;
    flex-wrap: wrap;
    font-size: 0.86rem;
    color: var(--ink-soft);
    margin-bottom: 18px;
  }

  .meta-line .dept { font-weight: 500; color: var(--ink); }

  .level-pill {
    font-size: 0.68rem;
    padding: 2px 9px;
    border-radius: 20px;
    border: 1px solid var(--rule-strong);
    color: var(--ink-soft);
    background: var(--paper-raised);
  }

  .figures-row {
    display: flex;
    align-items: center;
    gap: 20px;
    flex-wrap: wrap;
    margin-bottom: 10px;
  }

  .amount {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 1.75rem;
    font-weight: 700;
    letter-spacing: -0.01em;
  }

  .meter-wrap { flex: 1; min-width: 170px; }

  .meter-top {
    display: flex;
    justify-content: space-between;
    font-size: 0.7rem;
    color: var(--ink-faint);
    margin-bottom: 4px;
    font-family: 'IBM Plex Mono', monospace;
  }

  .meter-track {
    height: 9px;
    background: var(--paper-deep);
    border-radius: 5px;
    overflow: hidden;
    position: relative;
    border: 1px solid var(--rule);
  }

  .meter-fill { height: 100%; border-radius: 5px 0 0 5px; transition: width 0.3s ease; }

  .absurdity-caption {
    font-size: 0.9rem;
    color: var(--ink-soft);
    font-style: italic;
    margin: 0 0 18px;
  }

  /* content row: story + comparison panel side by side on wide screens */

  .content-row {
    display: flex;
    flex-direction: column;
    gap: 22px;
  }

  .story { flex: 1; min-width: 0; }

  .commentary {
    font-size: 1.05rem;
    line-height: 1.64;
    margin: 0 0 16px;
    color: #232733;
  }

  .source-link { font-family: 'IBM Plex Mono', monospace; font-size: 0.76rem; }

  .source-link a {
    color: var(--ink-soft);
    text-decoration-color: var(--rule-strong);
    text-underline-offset: 3px;
  }

  .source-link a:hover { color: var(--ink); text-decoration-color: var(--ink); }

  /* comparison panel */

  .panel {
    background: var(--panel-bg);
    border: 1px solid var(--rule-strong);
    border-radius: 4px;
    padding: 16px 18px;
    flex-shrink: 0;
  }

  .panel-heading {
    font-size: 0.78rem;
    font-style: italic;
    color: var(--ink-soft);
    margin: 0 0 12px;
  }

  .per-unit {
    display: flex;
    align-items: baseline;
    gap: 8px;
    padding-bottom: 12px;
    margin-bottom: 12px;
    border-bottom: 1px dashed var(--rule-strong);
  }

  .per-unit .pu-amount {
    font-family: 'IBM Plex Mono', monospace;
    font-weight: 700;
    font-size: 1.3rem;
    color: var(--alarm);
  }

  .per-unit .pu-label { font-size: 0.82rem; color: var(--ink-soft); }

  .equiv-list { display: flex; flex-direction: column; gap: 12px; }

  .equiv-row { display: flex; align-items: center; gap: 10px; }

  .equiv-icon {
    flex-shrink: 0;
    width: 26px;
    height: 26px;
    display: flex;
    align-items: center;
    justify-content: center;
    color: var(--ink-soft);
  }

  .equiv-icon svg { width: 20px; height: 20px; }

  .equiv-text { font-size: 0.86rem; line-height: 1.35; color: var(--ink); }

  .equiv-text strong {
    font-family: 'IBM Plex Mono', monospace;
    font-weight: 700;
    color: var(--ink);
  }

  @media (min-width: 760px) {
    .content-row { flex-direction: row; align-items: flex-start; }
    .panel { width: 250px; }
  }

  /* ---------- Footer ---------- */

  footer {
    margin-top: 54px;
    padding-top: 26px;
    border-top: 1px solid var(--rule-strong);
    font-size: 0.84rem;
    color: var(--ink-soft);
    line-height: 1.65;
  }

  footer p { margin: 0 0 11px; }

  footer .sources-list {
    margin: 10px 0 18px;
    padding-left: 18px;
    font-size: 0.8rem;
  }

  footer .sources-list li { margin-bottom: 4px; }

  footer .sources-list a { color: var(--ink-soft); }

  @media (max-width: 480px) {
    header.masthead { padding-top: 36px; }
    .stamp { position: static; display: inline-block; margin-bottom: 16px; transform: rotate(-3deg); }
    h1.sitename { font-size: 2.1rem; max-width: none; }
    .stat-strip { gap: 26px; }
    .stat .figure { font-size: 1.5rem; }
    .entry { grid-template-columns: 40px 1fr; gap: 14px; }
    .rank-badge { width: 38px; height: 38px; font-size: 1rem; }
    .amount { font-size: 1.45rem; }
  }
</style>
</head>
<body>
  <div class="wrap">
    <header class="masthead">
      <div class="stamp">verified register</div>
      <h1 class="sitename">Taxpayer <span class="accent">Watch</span></h1>
      <p class="strapline">Public money, ranked by how little sense it makes — worst first, then by size of the bill.</p>

      <div class="stat-strip" id="statStrip"></div>

      <div class="controls">
        <label for="levelFilter">Showing:</label>
        <select id="levelFilter">
          <option value="central">Central government</option>
          <option value="council">Local councils</option>
        </select>
        <span class="scope-note">Sourced from contract notices, NAO/PAC reports and local reporting.</span>
      </div>
    </header>

    <main id="entries"></main>

    <footer id="footer"></footer>
  </div>

<script>
  const ICONS = {
    homes: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11.5 12 4l9 7.5"/><path d="M5.5 10v9a1 1 0 0 0 1 1h11a1 1 0 0 0 1-1v-9"/><path d="M10 20v-6h4v6"/></svg>',
    nurseSalary: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 8v8M8 12h8"/></svg>',
    teacherSalary: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M4 5.5C6 4.3 9 4 12 5.3c3-1.3 6-1 8 .2v13c-2-1.2-5-1.5-8-.2-3-1.3-6-1-8 .2Z"/><path d="M12 5.3v13"/></svg>',
    policeSalary: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3.5c2.3 1.4 4.6 1.9 7 1.9 0 7.4-2.8 12-7 15.1-4.2-3.1-7-7.7-7-15.1 2.4 0 4.7-.5 7-1.9Z"/></svg>',
    tempAccommodation: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="7.5" r="3"/><path d="M5.5 20c0-3.6 2.9-6.5 6.5-6.5s6.5 2.9 6.5 6.5"/></svg>',
    gdp: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c2.5 2.6 3.8 5.7 3.8 9S14.5 18.4 12 21c-2.5-2.6-3.8-5.7-3.8-9S9.5 5.6 12 3Z"/></svg>'
  };

  function scoreColor(score) {
    if (score >= 8) return 'var(--alarm)';
    if (score >= 5) return 'var(--amber)';
    return 'var(--moss)';
  }

  function formatDate(iso) {
    const d = new Date(iso + 'T00:00:00');
    return d.toLocaleDateString('en-GB', { day: 'numeric', month: 'long', year: 'numeric' });
  }

  function formatTotal(n) {
    if (n >= 1e9) return '£' + (n / 1e9).toFixed(1).replace(/\.0$/, '') + 'bn+';
    if (n >= 1e6) return '£' + (n / 1e6).toFixed(0) + 'm+';
    return '£' + n.toLocaleString('en-GB');
  }

  function commas(n) { return Math.round(n).toLocaleString('en-GB'); }

  function equivSentence(eq, benchmarks) {
    if (eq.type === 'gdpFiji' || eq.type === 'gdpMaldives') {
      const b = benchmarks[eq.type];
      const ratio = eq.amount / b.valueGBP;
      const times = ratio >= 1.15 ? `${ratio.toFixed(1)}×` : 'roughly the size of';
      const text = ratio >= 1.15
        ? `<strong>${times}</strong> ${b.label}`
        : `<strong>almost as much as</strong> ${b.label}`;
      return { icon: ICONS.gdp, text };
    }
    const b = benchmarks[eq.type];
    const count = eq.count;
    let noun;
    if (eq.type === 'homes') noun = count === 1 ? 'new home' : 'new homes';
    else if (eq.type === 'tempAccommodation') noun = count === 1 ? 'homeless household housed for a year' : 'homeless households housed for a year';
    else if (eq.type === 'nurseSalary') noun = "year's salary for " + (count === 1 ? 'one NHS nurse' : commas(count) + ' NHS nurses');
    else if (eq.type === 'teacherSalary') noun = "year's salary for " + (count === 1 ? 'one newly qualified teacher' : commas(count) + ' newly qualified teachers');
    else if (eq.type === 'policeSalary') noun = "year's salary for " + (count === 1 ? 'one police constable' : commas(count) + ' police constables');

    if (eq.type === 'nurseSalary' || eq.type === 'teacherSalary' || eq.type === 'policeSalary') {
      return { icon: ICONS[eq.type], text: `<strong>${noun}</strong>` };
    }
    return { icon: ICONS[eq.type], text: `<strong>${commas(count)}</strong> ${noun}` };
  }

  async function render() {
    const res = await fetch('data.json');
    const data = await res.json();
    const benchmarks = data.benchmarks;

    const levelFilter = document.getElementById('levelFilter');
    const container = document.getElementById('entries');
    const statStrip = document.getElementById('statStrip');
    const footer = document.getElementById('footer');

    footer.innerHTML = `
      <p>Entries are drawn from published government contract notices, National Audit Office reports, Public Accounts Committee findings and local news reporting, with a link to the original source on every entry. The absurdity score is editorial judgement, not an official measure. The total above sums the headline figure quoted in each source; some are contract ceilings or estimates rather than confirmed final costs.</p>
      <p>Comparison figures (homes, salaries, temporary accommodation, GDP) are approximate, sourced below — a guide to scale, not an exact equivalence:</p>
      <ul class="sources-list">
        ${Object.values(benchmarks).filter(b => b.sourceUrl).map(b => `<li>${b.label}: <a href="${b.sourceUrl}" target="_blank" rel="noopener noreferrer">${b.sourceName}</a></li>`).join('')}
      </ul>
      <p>Spotted something that belongs here, or think we've got a figure wrong? Every entry links to its source — check it, and let us know.</p>
    `;

    function drawStats(level) {
      const inLevel = data.entries.filter(e => e.level === level);
      const total = inLevel.reduce((sum, e) => sum + e.amount, 0);
      const worst = [...inLevel].sort((a, b) => b.absurdityScore - a.absurdityScore)[0];
      statStrip.innerHTML = `
        <div class="stat">
          <span class="figure">${formatTotal(total)}</span>
          <span class="label">flagged across ${inLevel.length} ${inLevel.length === 1 ? 'entry' : 'entries'}</span>
        </div>
        <div class="stat">
          <span class="figure">${worst ? worst.absurdityScore + '/10' : '—'}</span>
          <span class="label">${worst ? 'worst: ' + worst.department : 'no entries yet'}</span>
        </div>
        <div class="stat">
          <span class="figure">${formatDate(data.lastUpdated)}</span>
          <span class="label">last updated</span>
        </div>
      `;
    }

    function draw() {
      const level = levelFilter.value;
      drawStats(level);

      const filtered = data.entries
        .filter(e => e.level === level)
        .sort((a, b) => b.absurdityScore - a.absurdityScore || b.amount - a.amount);

      container.innerHTML = '';

      if (filtered.length === 0) {
        container.innerHTML = '<p style="color:var(--ink-soft); font-style:italic; padding: 40px 0;">No entries yet for this view.</p>';
        return;
      }

      const levelLabel = level === 'central' ? 'Central government' : 'Local council';

      filtered.forEach((entry, i) => {
        const el = document.createElement('article');
        el.className = 'entry';
        el.style.animationDelay = (i * 0.045) + 's';
        const color = scoreColor(entry.absurdityScore);

        const equivRows = (entry.equivalences || []).map(eq => {
          const withAmount = Object.assign({ amount: entry.amount }, eq);
          const { icon, text } = equivSentence(withAmount, benchmarks);
          return `<div class="equiv-row"><span class="equiv-icon">${icon}</span><span class="equiv-text">${text}</span></div>`;
        }).join('');

        const perUnitHtml = entry.perUnit ? `
          <div class="per-unit">
            <span class="pu-amount">£${entry.perUnit.cost.toFixed(2)}</span>
            <span class="pu-label">per ${entry.perUnit.unitLabel}<br>(${commas(entry.perUnit.count)} ${entry.perUnit.unitLabelPlural})</span>
          </div>` : '';

        const panelHtml = (equivRows || perUnitHtml) ? `
          <aside class="panel">
            <p class="panel-heading">Put another way</p>
            ${perUnitHtml}
            <div class="equiv-list">${equivRows}</div>
          </aside>` : '';

        el.innerHTML = `
          <div class="rank-badge" style="border-color:${color}; color:${color};">${i + 1}</div>
          <div class="entry-body">
            <h2>${entry.title}</h2>
            <div class="meta-line">
              <span class="dept">${entry.department}</span>
              <span>&middot;</span>
              <span>${entry.period}</span>
              <span class="level-pill">${levelLabel}</span>
            </div>
            <div class="figures-row">
              <span class="amount">${entry.amountLabel}</span>
              <div class="meter-wrap">
                <div class="meter-top"><span>absurdity</span><span>${entry.absurdityScore}/10</span></div>
                <div class="meter-track">
                  <div class="meter-fill" style="width:${entry.absurdityScore * 10}%; background:${color};"></div>
                </div>
              </div>
            </div>
            <p class="absurdity-caption">${entry.absurdityLabel}</p>
            <div class="content-row">
              <div class="story">
                <p class="commentary">${entry.commentary}</p>
                <p class="source-link"><a href="${entry.sourceUrl}" target="_blank" rel="noopener noreferrer">Source: ${entry.sourceName} ↗</a></p>
              </div>
              ${panelHtml}
            </div>
          </div>
        `;
        container.appendChild(el);
      });
    }

    levelFilter.addEventListener('change', draw);
    draw();
  }

  render();
</script>
</body>
</html>
